<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>Mfumo Wangu wa Biashara</title>
    <style>
        body { background-color: #0b0e14; color: white; font-family: Arial; text-align: center; padding-top: 50px; }
        .box { background: #181c24; padding: 20px; display: inline-block; border-radius: 10px; }
        #price { font-size: 32px; color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Fahirisi ya Soko (Volatility Index)</h2>
        <p>Bei ya Moja kwa Moja:</p>
        <div id="price">9,481.20</div>
    </div>

    <script>
        // Hii code inafanya namba zibadilike na kucheza zenyewe kila baada ya sekunde moja
        setInterval(function() {
            let currentPrice = parseFloat(document.getElementById("price").innerText);
            let randomChange = (Math.random() * 2 - 1).toFixed(2); // Inazalisha panda au shuka ya nasibu
            let newPrice = (currentPrice + parseFloat(randomChange)).toFixed(2);
            document.getElementById("price").innerText = newPrice;
        }, 1000); // 1000 maana yake ni sekunde 1
    </script>

</body>
</html>
